<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" width="280" height="560">
  <defs>
    <clipPath id="screen">
      <rect x="12" y="12" width="256" height="536" rx="24"/>
    </clipPath>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d35"/>
      <stop offset="100%" stop-color="#1a1c22"/>
    </linearGradient>
  </defs>
  <!-- Phone body -->
  <rect x="0" y="0" width="280" height="560" rx="40" fill="url(#phoneBody)" stroke="#3a3d45" stroke-width="1"/>
  <!-- Screen -->
  <rect x="8" y="8" width="264" height="544" rx="32" fill="#0c0e12"/>
  <!-- Dynamic Island -->
  <rect x="100" y="16" width="80" height="24" rx="12" fill="#000"/>
  <!-- Status bar -->
  <text x="28" y="32" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="white">10:41</text>
  <!-- Signal bars -->
  <rect x="210" y="22" width="3" height="6" rx="1" fill="white"/>
  <rect x="215" y="20" width="3" height="8" rx="1" fill="white"/>
  <rect x="220" y="18" width="3" height="10" rx="1" fill="white"/>
  <rect x="225" y="16" width="3" height="12" rx="1" fill="white"/>
  <!-- WiFi -->
  <path d="M234,24 Q240,18 246,24" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M237,27 Q240,23 243,27" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="240" cy="29" r="1" fill="white"/>
  <!-- Battery -->
  <rect x="252" y="20" width="18" height="9" rx="2" stroke="white" stroke-width="1" fill="none"/>
  <rect x="270" y="23" width="2" height="3" rx="1" fill="white"/>
  <rect x="254" y="22" width="12" height="5" rx="1" fill="#4ade80"/>
  <!-- Gold icon -->
  <circle cx="38" cy="56" r="10" fill="#FFDE02"/>
  <text x="38" y="60" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1a1c22" text-anchor="middle">G</text>
  <!-- GOLD label -->
  <text x="56" y="60" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="white">GOLD</text>
  <!-- Price -->
  <text x="252" y="52" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="white" text-anchor="end">10,061.05 USD</text>
  <!-- Tab bar -->
  <text x="28" y="86" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="11" fill="#6c7a89">1W</text>
  <text x="60" y="86" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="11" fill="#6c7a89">Indicators</text>
  <!-- Chart area -->
  <g clip-path="url(#screen)">
    <!-- Horizontal grid lines -->
    <line x1="28" y1="120" x2="252" y2="120" stroke="#1e2128" stroke-width="0.5"/>
    <line x1="28" y1="160" x2="252" y2="160" stroke="#1e2128" stroke-width="0.5"/>
    <line x1="28" y1="200" x2="252" y2="200" stroke="#1e2128" stroke-width="0.5"/>
    <line x1="28" y1="240" x2="252" y2="240" stroke="#1e2128" stroke-width="0.5"/>
    <line x1="28" y1="280" x2="252" y2="280" stroke="#1e2128" stroke-width="0.5"/>
    <line x1="28" y1="320" x2="252" y2="320" stroke="#1e2128" stroke-width="0.5"/>
    <line x1="28" y1="360" x2="252" y2="360" stroke="#1e2128" stroke-width="0.5"/>
    <line x1="28" y1="400" x2="252" y2="400" stroke="#1e2128" stroke-width="0.5"/>
    <!-- Price labels right -->
    <text x="252" y="124" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2460.000</text>
    <text x="252" y="164" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2450.000</text>
    <text x="252" y="204" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2425.000</text>
    <text x="252" y="244" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2400.000</text>
    <text x="252" y="284" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2375.000</text>
    <text x="252" y="324" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2350.000</text>
    <text x="252" y="364" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2325.000</text>
    <text x="252" y="404" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2275.000</text>
    <text x="252" y="444" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="end">2225.000</text>
    <!-- Price line 2460.240 -->
    <line x1="28" y1="118" x2="200" y2="118" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="28" y="114" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="9" fill="#3b82f6">2460.240</text>
    <!-- Current price markers -->
    <rect x="195" y="108" width="42" height="14" rx="2" fill="#22c55e"/>
    <text x="216" y="118" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">2459.979</text>
    <rect x="195" y="124" width="42" height="14" rx="2" fill="#ef4444"/>
    <text x="216" y="134" font-family="SF Pro, Helvetica, Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">2459.779</text>
    <!-- Red horizontal line -->
    <line x1="28" y1="130" x2="252" y2="130" stroke="#ef4444" stroke-width="0.5"/>
    <!-- Yellow price line chart -->
    <polyline points="28,380 45,370 55,340 65,310 75,290 85,300 95,280 105,250 115,260 125,220 135,200 145,180 155,170 165,190 175,160 185,140 195,130 205,135 215,125 225,120 240,118" fill="none" stroke="#FFDE02" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Yellow area fill -->
    <polyline points="28,380 45,370 55,340 65,310 75,290 85,300 95,280 105,250 115,260 125,220 135,200 145,180 155,170 165,190 175,160 185,140 195,130 205,135 215,125 225,120 240,118 240,440 28,440" fill="url(#chartFill)" opacity="0.15"/>
    <defs>
      <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFDE02" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#FFDE02" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- Blue line -->
    <polyline points="28,135 60,133 100,131 140,130 180,129 220,128 252,127" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Home indicator -->
  <rect x="110" y="540" width="60" height="4" rx="2" fill="white" opacity="0.3"/>
</svg>
